<!doctype html>
<html lang="vi" data-agent="4">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent 4 · Hỏi Đáp</title>
<link rel="stylesheet" href="/design/platform-theme.css">
<link rel="stylesheet" href="chat.css">
<script src="/design/platform-theme.js"></script>
<script src="chat.js" defer></script>
</head>
<body>
<header class="chat-header">
  <a class="kt-portal-return" data-portal-return href="/#overview" target="_top" aria-label="Quay về workspace tổng" title="Quay về workspace tổng"><span aria-hidden="true">←</span><span class="kt-return-label">Workspace tổng</span></a>
  <span>Agent 4 · Hỏi Đáp</span>
</header>
<div class="chat">
  <aside class="side" aria-label="Gợi ý câu hỏi">
    <h2>Thử hỏi</h2>
    <ul class="suggest" id="suggest"></ul>
    <details class="metric-catalog">
      <summary>Chỉ tiêu có sẵn</summary>
      <p class="muted" id="metric-count">Đang tải danh mục.</p>
      <ul class="metrics" id="metrics"></ul>
    </details>
  </aside>

  <section class="main">
    <ol class="thread" id="thread" aria-live="polite">
      <li class="intro">
        <p class="data-badge">Kho dữ liệu mô phỏng</p>
        <h1>Hỏi Đáp</h1>
        <p>Đặt câu hỏi bằng tiếng Việt về doanh thu, lợi nhuận, công nợ hay dòng tiền. Câu trả lời đi kèm nguồn số liệu để bạn kiểm tra và đối chiếu.</p>
      </li>
    </ol>
    <form class="composer" id="composer">
      <label class="sr-only" for="question">Câu hỏi</label>
      <textarea id="question" rows="1" placeholder="Nhập câu hỏi về số liệu…" required></textarea>
      <button type="submit" id="send">Gửi</button>
    </form>
  </section>
</div>
</body>
</html>
