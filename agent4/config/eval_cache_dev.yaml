version: "1"
prompt_version: metric-selection-v1-structured
cache_enabled: true
embedding:
  provider: ollama
  model: qwen3-embedding:0.6b
  dimensions: 768
  cache_enabled: true
  cache_path: .cache/metric_selection_index_ollama.npz
retrieval:
  mode: hybrid
  dense_top_k: 15
  lexical_top_k: 15
  fusion_top_k: 20
  mention_retrieval_enabled: false
expansion:
  enabled: true
  max_hops: 1
  max_candidates: 30
  relationship_path: config/metric_relationships.yaml
reranking:
  metadata_enabled: true
  final_top_k: 12
llm:
  provider: ollama
  model: qwen2.5:0.5b
  temperature: 0
  timeout_s: 30
  max_retries: 0
  context_window: 4096
  structured_output: true
