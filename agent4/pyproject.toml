[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent4-cfo"
version = "0.2.0"
description = "Synthetic financial data foundation for Agent 4"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "numpy>=1.26",
    "pandas>=2.0",
    "pydantic>=2.8",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.setuptools.packages.find]
include = ["agent4*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = ["slow: regenerates full synthetic data"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Legacy deterministic generator intentionally exposes DataFrames to DuckDB by
# Python variable name and preserves explicit integer casts for accounting data.
"agent4/datagen/*.py" = ["F841", "SIM103", "RUF046", "FURB192", "RUF059", "RUF100"]
"tests/test_budget_seed.py" = ["I001"]
