[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent4-cfo"
version = "0.2.0"
description = "Synthetic financial data foundation for Agent 4"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.0", "pandas>=2.0", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.setuptools.packages.find]
include = ["agent4*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = ["slow: regenerates full synthetic data"]
